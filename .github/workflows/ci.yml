name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: encurtador
          POSTGRES_USER: encurtador
          POSTGRES_PASSWORD: encurtador
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U encurtador -d encurtador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://encurtador:encurtador@localhost:5433/encurtador
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Fase 1: migrações no banco do service e integração (cria e migra encurtador_test sozinho).
      - run: pnpm --filter @encurtador/db db:migrate

      - run: pnpm --filter @encurtador/db test:integration

      # Fase 2: redirect contra o Postgres (encurtador_test) e o Redis (db 1) dos services.
      - run: pnpm --filter @encurtador/redirect test:integration

      # Fase 3: pipeline de cliques (worker, inclusive 4 workers × 100.000 eventos e fim a fim).
      - run: pnpm --filter @encurtador/worker test:integration

      # Fase 4: API /v1 por rota (auth, chaves, links, stats, SSE, prévia, público, OpenAPI, seed).
      - run: pnpm --filter @encurtador/api test:integration

      # Seed demo duas vezes no banco do service: idempotente.
      - run: pnpm seed:demo && pnpm seed:demo
